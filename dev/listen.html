<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Groove: listen (dev)</title>
    <style>
      body { font-family: ui-monospace, monospace; background: #111; color: #ddd; margin: 1rem; max-width: 60rem; }
      label { display: block; margin: 0.5rem 0; }
      input[type='range'] { width: 20rem; vertical-align: middle; }
      pre { background: #1b1b1b; padding: 0.5rem; overflow-x: auto; }
      #error { color: #ff6b6b; }
      canvas { display: none; }
    </style>
  </head>
  <body>
    <h1>Ghost Groove: listening page</h1>
    <p id="error"></p>
    <button id="play" disabled>Play</button>
    <label>Band A center <input id="bandA" type="range" min="0" max="1" step="0.01" value="0.3" /> <span id="bandAv"></span></label>
    <label>Band B center <input id="bandB" type="range" min="0" max="1" step="0.01" value="0.7" /> <span id="bandBv"></span></label>
    <label>Density <input id="density" type="range" min="0" max="100" step="1" /> <span id="densityv"></span></label>
    <label>Mood
      <select id="mood">
        <option value="hollow">Hollow</option>
        <option value="neon">Neon</option>
      </select>
    </label>
    <p>Step: <span id="step">-</span> &nbsp; Bar: <span id="bar">-</span></p>
    <pre id="info"></pre>
    <canvas id="canvas"></canvas>
    <script type="module" src="./listen.ts"></script>
  </body>
</html>
